<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>일해라 공무원</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6fc7aff34f9c4762b8c5e7bfabf65c33&libraries=services&autoload=false"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; line-height: 1.6; background-color: #f8f9fa; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #fee500; padding-bottom: 10px; margin-top: 0; }
        
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        h3 { margin-top: 0; font-size: 1.1em; color: #555; }

        .manual-search { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .manual-search input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }

        .drop-zone { padding: 40px 20px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; background-color: #fcfcfc; cursor: pointer; transition: 0.3s; }
        .drop-zone.dragover { background-color: #fff9c4; border-color: #fee500; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 10px 20px; background: #fee500; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ffd400; }
        .btn-excel { background: #28a745; color: white; display: none; }
        .btn-zip { background: #007bff; color: white; display: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; position: sticky; top: 0; }
        .status { color: #0066cc; font-size: 1.1em; margin-top: 10px; font-weight: bold; text-align: center; padding: 10px; border-radius: 5px;}
        
        .footer-notice {
            margin-top: 30px;
            padding: 15px;
            background-color: #f1f3f5;
            border-radius: 6px;
            color: #666;
            font-size: 0.95em;
            text-align: center;
            border-left: 5px solid #adb5bd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 좌표 정보를 이용하여 법정동 주소를 출력합니다.</h2>
    
    <div class="section">
        <h3>📍 수동 좌표 검색 (사진 속성 정보 입력)</h3>
        <div class="manual-search" style="flex-wrap: wrap;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <b>위도:</b>
                <input type="number" id="latDeg" placeholder="37" style="width: 60px;"> <b>;</b>
                <input type="number" id="latMin" placeholder="24" style="width: 60px;"> <b>;</b>
                <input type="number" step="any" id="latSec" placeholder="12.95999..." style="width: 110px;">
            </div>
            <div style="display: flex; gap: 8px; align-items: center; margin-left: 15px;">
                <b>경도:</b>
                <input type="number" id="lngDeg" placeholder="128" style="width: 60px;"> <b>;</b>
                <input type="number" id="lngMin" placeholder="41" style="width: 60px;"> <b>;</b>
                <input type="number" step="any" id="lngSec" placeholder="30.46199..." style="width: 110px;">
            </div>
            <button onclick="searchManualCoords()" style="margin-left: 15px;">주소 찾기 및 추가</button>
        </div>
    </div>

    <div class="section">
        <h3>📁 사진 파일 업로드</h3>
        <div id="dropZone" class="drop-zone">
            <p>📂 사진들을 여기로 드래그하거나 클릭하여 선택하세요.</p>
            <input type="file" id="photoInput" accept="image/*" multiple style="display: none;">
        </div>
        <div id="statusMsg" class="status">✅ 준비 완료! 사진을 드래그하거나 수동으로 검색하세요.</div>
        
        <div class="btn-group">
            <button id="downloadBtn" class="btn-excel" onclick="exportToExcel()">엑셀(.xlsx) 저장</button>
            <button id="zipBtn" class="btn-zip" onclick="downloadRenamedZip()">이름 변경된 사진(ZIP) 저장</button>
        </div>
    </div>

    <table id="resultTable" style="display:none;">
        <thead>
            <tr>
                <th>원본 파일명</th>
                <th>변경될 파일명</th>
                <th>위도</th>
                <th>경도</th>
                <th>법정동 주소</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>

    <div class="footer-notice">
        💡 <b>안내:</b> 사진을 새로 드래그하여 올리면 기존의 리스트와 번호(카운트)가 모두 <b>초기화</b>됩니다.
    </div>
</div>

<script>
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => e.preventDefault());

    var finalData = [];
    var addressCounter = {}; 
    var geocoder = null;

    kakao.maps.load(function() {
        geocoder = new kakao.maps.services.Geocoder();
    });

    const dropZone = document.getElementById('dropZone');
    const photoInput = document.getElementById('photoInput');

    dropZone.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', e => {
        if (e.target.files.length > 0) processPhotos(e.target.files);
    });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) processPhotos(e.dataTransfer.files);
    });

    async function searchManualCoords() {
        if (!geocoder) { alert("시스템 준비 중입니다. 잠시 후 다시 시도해주세요."); return; }
        
        const latD = parseFloat(document.getElementById('latDeg').value) || 0;
        const latM = parseFloat(document.getElementById('latMin').value) || 0;
        const latS = parseFloat(document.getElementById('latSec').value) || 0;
        
        const lngD = parseFloat(document.getElementById('lngDeg').value) || 0;
        const lngM = parseFloat(document.getElementById('lngMin').value) || 0;
        const lngS = parseFloat(document.getElementById('lngSec').value) || 0;

        if (latD === 0 && lngD === 0) { 
            alert("정확한 좌표를 입력해주세요."); 
            return; 
        }

        const lat = latD + (latM / 60) + (latS / 3600);
        const lng = lngD + (lngM / 60) + (lngS / 3600);

        const address = await getAddressFromCoords(lat, lng);
        const newName = generateNewName(address, "manual_input.jpg", finalData.length + 1);
        const data = { 
            filename: "수동 입력", 
            newFilename: newName, 
            lat: lat.toFixed(6), 
            lng: lng.toFixed(6), 
            address: address 
        };
        
        finalData.push(data);
        addTableRow(data);
        showResultsUI();
        
        // 입력 후 칸 비우기 (원치 않으시면 아래 6줄은 지우셔도 됩니다)
        document.getElementById('latDeg').value = ''; document.getElementById('latMin').value = ''; document.getElementById('latSec').value = '';
        document.getElementById('lngDeg').value = ''; document.getElementById('lngMin').value = ''; document.getElementById('lngSec').value = '';
    }

    async function processPhotos(files) {
        if (!geocoder) { alert("시스템 준비 중입니다."); return; }
        
        const statusMsg = document.getElementById('statusMsg');
        const resultBody = document.getElementById('resultBody');
        const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (imageFiles.length === 0) return;

        finalData = [];
        addressCounter = {};
        resultBody.innerHTML = ""; 
        document.getElementById('downloadBtn').style.display = "none";
        document.getElementById('zipBtn').style.display = "none";

        statusMsg.innerText = `사진 분석 중... (오류 파일은 자동 스킵됩니다)`;
        document.getElementById('resultTable').style.display = "table";

        let fileMetadataArray = [];
        for (let i = 0; i < imageFiles.length; i++) {
            const file = imageFiles[i];
            const meta = await getPhotoMetadata(file);
            fileMetadataArray.push({
                file: file, lat: meta.lat, lng: meta.lng,
                dateStr: meta.dateStr, timestamp: meta.timestamp 
            });
        }

        fileMetadataArray.sort((a, b) => {
            if (a.dateStr && b.dateStr) return a.dateStr.replace(/\D/g, "") - b.dateStr.replace(/\D/g, "");
            if (a.dateStr) return -1;
            if (b.dateStr) return 1;
            return a.timestamp - b.timestamp;
        });

        for (let i = 0; i < fileMetadataArray.length; i++) {
            statusMsg.innerText = `주소 변환 중... (${i + 1} / ${fileMetadataArray.length})`;
            const item = fileMetadataArray[i];
            let address = "위치 정보 없음";
            let latStr = "-", lngStr = "-";

            if (item.lat && item.lng) {
                address = await getAddressFromCoords(item.lat, item.lng);
                latStr = item.lat.toFixed(6);
                lngStr = item.lng.toFixed(6);
            }

            const newName = generateNewName(address, item.file.name, i + 1);
            const data = { 
                filename: item.file.name, newFilename: newName, 
                lat: latStr, lng: lngStr, address: address, blob: item.file 
            };
            
            finalData.push(data);
            addTableRow(data);
        }

        statusMsg.innerText = "✨ 분석 완료! 촬영 시간순으로 번호가 매겨졌습니다.";
        showResultsUI();
        photoInput.value = ""; 
    }

    function generateNewName(address, originalName, globalIndex) {
        let prefix = globalIndex ? `(${globalIndex}) ` : ``;

        if (address === "위치 정보 없음" || address === "주소 찾기 불가") {
            return `${prefix}${originalName}`;
        }
        
        let parts = address.split(' ');
        
        if (parts.length > 1) {
            parts.shift(); 
        }
        
        const cleanAddr = parts.join(' ');
        
        if (!addressCounter[cleanAddr]) addressCounter[cleanAddr] = 1;
        else addressCounter[cleanAddr]++;

        const num = String(addressCounter[cleanAddr]).padStart(3, '0');
        const ext = originalName.split('.').pop();

        return `${prefix}${cleanAddr}(${num}).${ext}`;
    }

    function getPhotoMetadata(file) {
        return new Promise(resolve => {
            // 타임아웃 설정: 손상된 사진으로 인한 무한 대기 방지
            const timeoutId = setTimeout(() => {
                resolve({ lat: null, lng: null, dateStr: null, timestamp: file.lastModified });
            }, 1500);

            try {
                EXIF.getData(file, function() {
                    clearTimeout(timeoutId); // 정상 콜백 시 타임아웃 해제

                    const lat = EXIF.getTag(this, "GPSLatitude");
                    const lng = EXIF.getTag(this, "GPSLongitude");
                    const latRef = EXIF.getTag(this, "GPSLatitudeRef");
                    const lngRef = EXIF.getTag(this, "GPSLongitudeRef");
                    const dateOriginal = EXIF.getTag(this, "DateTimeOriginal");

                    let result = { lat: null, lng: null, dateStr: dateOriginal, timestamp: file.lastModified };

                    // 좌표 데이터가 온전한 배열(길이 3)인지 검증
                    if (lat && lng && lat.length === 3 && lng.length === 3) {
                        const convert = (dms, ref) => {
                            let dec = dms[0] + dms[1]/60 + dms[2]/3600;
                            return (ref === "S" || ref === "W") ? dec * -1 : dec;
                        };
                        result.lat = convert(lat, latRef);
                        result.lng = convert(lng, lngRef);
                    }
                    resolve(result);
                });
            } catch (error) {
                clearTimeout(timeoutId);
                resolve({ lat: null, lng: null, dateStr: null, timestamp: file.lastModified });
            }
        });
    }

    function getAddressFromCoords(lat, lng) {
        return new Promise(resolve => {
            var coord = new kakao.maps.LatLng(lat, lng);
            geocoder.coord2Address(coord.getLng(), coord.getLat(), function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    resolve(result[0].address.address_name);
                } else {
                    geocoder.coord2RegionCode(coord.getLng(), coord.getLat(), function(regionResult, regionStatus) {
                        if (regionStatus === kakao.maps.services.Status.OK) {
                            resolve(regionResult[0].address_name);
                        } else {
                            resolve("주소 찾기 불가");
                        }
                    });
                }
            });
        });
    }

    function addTableRow(data) {
        const row = `<tr>
            <td>${data.filename}</td>
            <td style="color: #d9534f; font-weight: bold;">${data.newFilename}</td>
            <td>${data.lat}</td>
            <td>${data.lng}</td>
            <td>${data.address}</td>
        </tr>`;
        document.getElementById('resultBody').innerHTML += row;
    }

    function showResultsUI() {
        document.getElementById('downloadBtn').style.display = "inline-block";
        document.getElementById('zipBtn').style.display = "inline-block";
        document.getElementById('resultTable').style.display = "table";
    }

    function exportToExcel() {
        if (finalData.length === 0) return;
        const wsData = finalData.map(d => ({
            "원본파일명": d.filename, "변경파일명": d.newFilename,
            "위도": d.lat, "경도": d.lng, "법정동주소": d.address
        }));
        const ws = XLSX.utils.json_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Result");
        XLSX.writeFile(wb, `위치분석결과_${new Date().getTime()}.xlsx`);
    }

    async function downloadRenamedZip() {
        if (finalData.length === 0) return;
        const zip = new JSZip();
        finalData.forEach(data => { 
            if (data.blob) zip.file(data.newFilename, data.blob); 
        });
        const content = await zip.generateAsync({ type: "blob" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `변경된사진_${new Date().getTime()}.zip`;
        link.click();
    }
</script>
</body>
</html>
